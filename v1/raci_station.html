<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RACI Challenge Station</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0b0d13;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .kiosk-card {
      width: 100%;
      max-width: 680px;
      background: #151821;
      border: 1px solid #232838;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    }
    .hidden { display: none; }
    h1 { font-size: 26px; color: #38bdf8; margin-bottom: 8px; }
    p.sub { color: #94a3b8; font-size: 15px; margin-bottom: 24px; }
    .btn {
      background: #0284c7;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
    }
    .btn:hover { background: #0369a1; }
    #qrcode { display: inline-block; background: #fff; padding: 14px; border-radius: 10px; margin: 16px 0; }

    .timer-badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      background: #1e293b;
      color: #f59e0b;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
    }

    /* Quiz Layout */
    .progress-bar { font-size: 13px; color: #38bdf8; font-weight: bold; text-transform: uppercase; margin-bottom: 12px; }
    .scenario-box {
      background: #0f1117;
      border-left: 4px solid #38bdf8;
      border-radius: 6px;
      padding: 14px 18px;
      text-align: left;
      font-size: 15px;
      line-height: 1.4;
      color: #e2e8f0;
      margin-bottom: 14px;
    }
    .question-title { font-size: 16px; font-weight: 600; text-align: left; margin-bottom: 18px; color: #fff; }
    .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
    .opt-btn {
      background: #1e2433;
      border: 1px solid #2d3748;
      border-radius: 8px;
      padding: 14px;
      color: #cbd5e1;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }
    .opt-btn:hover { background: #283247; border-color: #475569; }
    .opt-btn.correct { background: #064e3b !important; border-color: #10b981 !important; color: #fff !important; }
    .opt-btn.wrong { background: #7f1d1d !important; border-color: #ef4444 !important; color: #fff !important; }

    .result-score { font-size: 48px; font-weight: bold; color: #4ade80; margin: 16px 0; }
  </style>
</head>
<body>

  <div class="kiosk-card">
    
    <!-- STANDBY -->
    <div id="standbyView">
      <h1>RACI Challenge Station</h1>
      <p class="sub">5 questions • 50 points each • Test your governance mastery</p>
      <button class="btn" onclick="openSession()">Start Game</button>
    </div>

    <!-- QR SCAN -->
    <div id="qrView" class="hidden">
      <h1>Scan with Visitor Pass</h1>
      <p class="sub">Scan this code on your mobile phone to begin</p>
      <div id="qrcode"></div>
      <br />
      <div class="timer-badge">Session expires in: <span id="qrTimeLeft">60</span>s</div>
      <br /><br />
      <button class="btn" style="background:#334155;" onclick="resetStandby('CANCEL')">Cancel</button>
    </div>

    <!-- QUIZ ACTIVE -->
    <div id="activeView" class="hidden">
      <div class="progress-bar" id="qProgress">Question 1 of 5</div>
      <div class="scenario-box" id="qScenario"></div>
      <div class="question-title" id="qText"></div>

      <div class="options-grid" id="optionsContainer"></div>
    </div>

    <!-- RESULT -->
    <div id="resultView" class="hidden">
      <h1>Challenge Completed!</h1>
      <p class="sub">Player: <span id="resPlayer" style="color:#fff; font-weight:bold;"></span></p>
      <div class="result-score" id="resScore">0 pts</div>
      <p id="resBreakdown" style="color:#94a3b8; font-size:15px; margin-bottom: 20px;"></p>
    </div>

  </div>

  <script>
    const STATION_ID = "station_raci";
    const API_BASE = "https://lby0uv2u5g.execute-api.us-east-1.amazonaws.com/default";

    let currentScreen = "standbyView";
    let questions = [];
    let currentIndex = 0;
    let correctCount = 0;
    let pollInterval = null;
    let qrTimer = null;
    let nextQuestionTimeout = null;
    let baselineTimestamp = null;
    let activePlayerName = "";
    let isAnsweringLocked = false;
    let qrRendered = false;

    // Fetch questions on boot
    fetch("raci_questions.json")
      .then(r => r.json())
      .then(data => questions = data)
      .catch(e => console.error("Error loading raci_questions.json", e));

    function openSession() {
      showSection("qrView");
      if (!qrRendered) {
        new QRCode(document.getElementById("qrcode"), {
          text: STATION_ID,
          width: 180,
          height: 180,
          colorDark: "#000",
          colorLight: "#fff"
        });
        qrRendered = true;
      }

      fetch(`${API_BASE}/station-status?station_id=${STATION_ID}`)
        .then(r => r.json())
        .then(d => baselineTimestamp = d.last_trigger_at);

      // Start 60-second QR Auto-Expire Timer
      let remaining = 60;
      document.getElementById("qrTimeLeft").innerText = remaining;
      clearInterval(qrTimer);
      qrTimer = setInterval(() => {
        remaining--;
        document.getElementById("qrTimeLeft").innerText = remaining;
        if (remaining <= 0) {
          resetStandby("EXPIRED");
        }
      }, 1000);

      clearInterval(pollInterval);
      pollInterval = setInterval(checkScanStatus, 1500);
    }

    async function checkScanStatus() {
      try {
        const res = await fetch(`${API_BASE}/station-status?station_id=${STATION_ID}`);
        if (!res.ok) return;
        const d = await res.json();

        // 1. In QR view -> player scanned -> Stop QR timer & start quiz
        if (currentScreen === "qrView" && d.status === "ACTIVE" && d.visitor_name && d.last_trigger_at !== baselineTimestamp) {
          clearInterval(qrTimer);
          activePlayerName = d.visitor_name;
          startQuiz();
          return;
        }

        // 2. In Active Quiz view -> staff clicked "Close" (Status became IDLE) -> Force reset to standby
        if (currentScreen === "activeView" && d.status === "IDLE") {
          clearInterval(pollInterval);
          clearInterval(qrTimer);
          clearTimeout(nextQuestionTimeout);
          showSection("standbyView");
        }
      } catch (e) {}
    }

    function startQuiz() {
      currentIndex = 0;
      correctCount = 0;
      showSection("activeView");
      renderQuestion();
    }

    function renderQuestion() {
      isAnsweringLocked = false;
      const q = questions[currentIndex];
      document.getElementById("qProgress").innerText = `Question ${currentIndex + 1} of ${questions.length}`;
      document.getElementById("qScenario").innerText = q.scenario;
      document.getElementById("qText").innerText = q.question;

      const container = document.getElementById("optionsContainer");
      container.innerHTML = "";

      Object.entries(q.options).forEach(([key, val]) => {
        const btn = document.createElement("button");
        btn.className = "opt-btn";
        btn.dataset.key = key;
        btn.innerHTML = `<strong>${key}.</strong> ${val}`;
        btn.onclick = () => selectOption(key, btn);
        container.appendChild(btn);
      });
    }

    function selectOption(selectedKey, clickedBtn) {
      if (isAnsweringLocked) return;
      isAnsweringLocked = true;

      const currentQ = questions[currentIndex];
      const isCorrect = (selectedKey === currentQ.correct);

      if (isCorrect) {
        clickedBtn.classList.add("correct");
        correctCount += 1;
      } else {
        clickedBtn.classList.add("wrong");
        document.querySelectorAll(".opt-btn").forEach(btn => {
          if (btn.dataset.key === currentQ.correct) {
            btn.classList.add("correct");
          }
        });
      }

      nextQuestionTimeout = setTimeout(() => {
        currentIndex++;
        if (currentIndex < questions.length) {
          renderQuestion();
        } else {
          finishQuiz();
        }
      }, 1200);
    }

    async function finishQuiz() {
      clearInterval(pollInterval);
      clearInterval(qrTimer);
      showSection("resultView");
      const totalScore = correctCount * 50;

      document.getElementById("resPlayer").innerText = activePlayerName;
      document.getElementById("resScore").innerText = `+${totalScore} pts`;
      document.getElementById("resBreakdown").innerText = `${correctCount} of ${questions.length} correct answers`;

      try {
        await fetch(`${API_BASE}/station-submit`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            station_id: STATION_ID,
            correct_count: correctCount,
            total_questions: questions.length
          })
        });
      } catch (e) {}

      setTimeout(() => {
        showSection("standbyView");
      }, 5000);
    }

    function resetStandby(reason = "CANCEL") {
      clearInterval(pollInterval);
      clearInterval(qrTimer);
      clearTimeout(nextQuestionTimeout);
      fetch(`${API_BASE}/station-reset`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ station_id: STATION_ID, reason: reason })
      });
      showSection("standbyView");
    }

    function showSection(id) {
      currentScreen = id;
      ["standbyView", "qrView", "activeView", "resultView"].forEach(s => {
        document.getElementById(s).classList.toggle("hidden", s !== id);
      });
    }
  </script>
</body>
</html>
