<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Close Station</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1117;
      color: #fff;
      padding: 30px 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 420px;
    }
    .station-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .station-row {
      background: #1a1d26;
      border: 1px solid #282d3d;
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .station-name {
      font-size: 15px;
      font-weight: 600;
    }
    .btn-close {
      background: #dc2626;
      color: #fff;
      border: none;
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .btn-close:active {
      background: #b91c1c;
      transform: scale(0.97);
    }
    #statusMsg {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      font-weight: 600;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="station-list">
      <div class="station-row">
        <span class="station-name">RACI Station</span>
        <button class="btn-close" onclick="closeStation('station_raci')">Close</button>
      </div>

      <div class="station-row">
        <span class="station-name">Voting Station</span>
        <button class="btn-close" onclick="closeStation('station_voting')">Close</button>
      </div>

      <div class="station-row">
        <span class="station-name">Commitment Station</span>
        <button class="btn-close" onclick="closeStation('station_commitment')">Close</button>
      </div>

      <div class="station-row">
        <span class="station-name">Try-On Station</span>
        <button class="btn-close" onclick="closeStation('station_tryon')">Close</button>
      </div>
    </div>

    <div id="statusMsg"></div>
  </div>

  <script>
    const API_BASE = "https://lby0uv2u5g.execute-api.us-east-1.amazonaws.com/default";

    async function closeStation(stationId) {
      const msg = document.getElementById("statusMsg");
      msg.style.color = "#38bdf8";
      msg.innerText = "Closing station...";

      try {
        const res = await fetch(`${API_BASE}/staff/station-close`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ station_id: stationId, reason: "STAFF_MANUAL_CLOSE" })
        });

        if (res.ok) {
          msg.style.color = "#4ade80";
          msg.innerText = "Station closed";
        } else {
          throw new Error("Failed to close");
        }
      } catch (err) {
        msg.style.color = "#f87171";
        msg.innerText = "Error closing station";
      }

      setTimeout(() => {
        msg.innerText = "";
      }, 3000);
    }
  </script>
</body>
</html>
