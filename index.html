<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HoloTube</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Shown until this browser has a valid token. -->
  <main id="gate" class="panel" hidden>
    <h1>HoloTube</h1>
    <p class="sub">Register to continue.</p>

    <form id="register-form" novalidate>
      <label for="name">Name</label>
      <input id="name" name="name" type="text" maxlength="100"
             autocomplete="name" placeholder="Your name" required>

      <label for="number">Number</label>
      <input id="number" name="number" type="tel" maxlength="20"
             autocomplete="tel" placeholder="Phone number" required>

      <button id="submit" type="submit">Continue</button>
    </form>

    <p id="gate-error" class="error" role="alert" hidden></p>
  </main>

  <!-- Registered, but not standing at a station yet. -->
  <main id="lobby" class="panel" hidden>
    <h1>Hi, <span id="lobby-name"></span></h1>
    <p class="sub">Scan the QR code at a station to join it.</p>

    <button id="scan" type="button">Scan QR code</button>

    <div id="reader" class="reader" hidden></div>

    <p id="scan-status" class="status" role="status" hidden></p>

    <details id="manual">
      <summary>Enter the code manually</summary>
      <form id="manual-form" novalidate>
        <label for="manual-code">Station code</label>
        <input id="manual-code" name="access_token" type="text" inputmode="numeric"
               maxlength="24" placeholder="Digits under the QR code" required>
        <button type="submit">Join station</button>
      </form>
    </details>

    <p id="lobby-error" class="error" role="alert" hidden></p>

    <button id="signout" type="button" class="link">Sign out</button>
  </main>

  <!-- Holding a seat. The quiz itself runs in the game client, not here. -->
  <main id="station" class="panel" hidden>
    <h1>You are at</h1>
    <p class="station-name" id="station-name"></p>
    <p class="sub">Station claimed. Play the quiz on the screen.</p>

    <p class="status" id="station-state" role="status" hidden></p>

    <button id="done" type="button" class="secondary">Done at this station</button>

    <button id="signout-2" type="button" class="link">Sign out</button>
  </main>

  <script src="js/vendor/html5-qrcode.min.js"></script>
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
